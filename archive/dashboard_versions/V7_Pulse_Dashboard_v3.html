<title>V7 Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#f2f5f4;--paper:#ffffff;--surface:#fcfcfb;--sunk:#eef2f1;
  --ink:#0f1f20;--ink-2:#465655;--muted:#6f7c7b;
  --hair:#dde4e2;--hair-strong:#c3cecc;
  --accent:#0e5e63;--accent-ink:#ffffff;--accent-soft:#e1efed;
  --lemon:#e9a92a;--lemon-soft:#fdf3dc;
  --pos:#2a78d6;--neu:#a9aea9;--neg:#e34948;
  --bar:#0e5e63;--bar-2:#c6d0ce;
  --good:#0ca30c;--warning:#fab219;--critical:#d03b3b;
  --good-text:#006300;--bad-text:#b42323;
  --shadow:0 1px 2px rgba(15,31,32,.06),0 18px 48px -18px rgba(15,31,32,.28);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --arabic:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0c1213;--paper:#131b1c;--surface:#161f20;--sunk:#0f1617;
    --ink:#ecf2f1;--ink-2:#a8b6b4;--muted:#859391;
    --hair:#243031;--hair-strong:#35433f;
    --accent:#5cb8b2;--accent-ink:#06191a;--accent-soft:#16302f;
    --lemon:#f2b53a;--lemon-soft:#2e2715;
    --pos:#3987e5;--neu:#5d635f;--neg:#e66767;
    --bar:#5cb8b2;--bar-2:#3a4645;
    --good-text:#3cc23c;--bad-text:#f08080;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 18px 48px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0c1213;--paper:#131b1c;--surface:#161f20;--sunk:#0f1617;
  --ink:#ecf2f1;--ink-2:#a8b6b4;--muted:#859391;
  --hair:#243031;--hair-strong:#35433f;
  --accent:#5cb8b2;--accent-ink:#06191a;--accent-soft:#16302f;
  --lemon:#f2b53a;--lemon-soft:#2e2715;
  --pos:#3987e5;--neu:#5d635f;--neg:#e66767;
  --bar:#5cb8b2;--bar-2:#3a4645;
  --good-text:#3cc23c;--bad-text:#f08080;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 18px 48px -18px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.5 var(--body)}
button,select,input{font:inherit;color:inherit}
a{color:var(--accent);text-underline-offset:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.ar,[dir="rtl"]{font-family:var(--arabic)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;background:var(--paper);border-right:1px solid var(--hair);padding:18px 12px 14px;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-.01em;padding:2px 10px 18px;background:none;border:0;cursor:pointer;text-align:left;white-space:nowrap;flex:none}
.brand svg{width:26px;height:26px;flex:none}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;border-radius:8px;background:none;color:var(--ink-2);cursor:pointer;text-align:left;font-size:14px;white-space:nowrap}
.nav svg{width:16px;height:16px;flex:none}
.nav:hover{background:var(--sunk);color:var(--ink)}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .count{margin-left:auto;font-family:var(--mono);font-size:10.5px;line-height:18px;min-width:18px;text-align:center;border-radius:999px;background:var(--critical);color:#fff;padding:0 5px}
.side-sec{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:14px 10px 4px}
.side .grow{flex:1;min-height:12px}
.side-foot{font-size:11.5px;color:var(--muted);padding:10px;border-top:1px solid var(--hair);line-height:1.5}
.side-foot b{color:var(--ink-2);font-weight:500}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in oklab,var(--ground) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--hair);padding:14px 24px 12px;display:flex;flex-direction:column;gap:10px}
.top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.top h1{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:-.02em;margin:0;line-height:1.15}
.period{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:2px}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.demo{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:999px;border:1px dashed var(--hair-strong);color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--hair-strong);background:var(--paper);border-radius:8px;padding:6px 11px;cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn svg{width:14px;height:14px}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.flabel{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;background:var(--paper);border:1px solid var(--hair-strong);border-radius:8px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:600}
.sel{border:1px solid var(--hair-strong);background:var(--paper);border-radius:8px;padding:5px 8px;font-size:13px;max-width:100%}
.pchips{display:flex;gap:4px;flex-wrap:wrap}
.pchip{border:1px solid var(--hair-strong);background:var(--paper);border-radius:999px;padding:3px 9px;font-size:12px;cursor:pointer;color:var(--ink-2)}
.pchip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.dd{position:relative}
.pop{position:absolute;top:calc(100% + 6px);left:0;z-index:40;background:var(--paper);border:1px solid var(--hair-strong);border-radius:10px;box-shadow:var(--shadow);padding:8px;width:300px;max-width:calc(100vw - 32px)}
.pop label{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13.5px}
.pop label:hover{background:var(--sunk)}
.pop label .ar{margin-left:auto;color:var(--muted);font-size:12.5px}
.pop-sec{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:8px 8px 2px}
.pop-foot{display:flex;justify-content:space-between;border-top:1px solid var(--hair);margin-top:6px;padding:8px 4px 2px}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;padding:2px 4px;font-size:13px}
.linkbtn:hover{text-decoration:underline}
.st{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;padding:1px 5px;border-radius:4px;border:1px solid var(--hair-strong);color:var(--muted);white-space:nowrap}
.st.new{border-color:var(--lemon);background:var(--lemon-soft);color:var(--ink)}
.st.seasonal{border-style:dashed}

#content{padding:20px 24px 56px;display:flex;flex-direction:column;gap:16px;min-width:0}

/* ---------- layout ---------- */
.g{display:grid;gap:16px;grid-template-columns:repeat(12,minmax(0,1fr))}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.panel{background:var(--surface);border:1px solid var(--hair);border-radius:12px;padding:16px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ph h2{font-size:14.5px;font-weight:600;margin:0;display:flex;align-items:center}
.ph .hint{font-size:12px;color:var(--muted)}
.sub-h{font-size:11.5px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 0 8px}
.info{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--hair-strong);background:var(--paper);color:var(--muted);font:italic 600 10px/1 Georgia,serif;cursor:help;padding:0;margin-left:6px;flex:none}
.info:hover,.info:focus-visible{border-color:var(--accent);color:var(--accent)}

.kpis{display:grid;gap:12px;grid-template-columns:repeat(6,minmax(0,1fr))}
.kpi{background:var(--surface);border:1px solid var(--hair);border-radius:12px;padding:13px 14px;min-width:0}
.k-top{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.k-l{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;line-height:1.35;color:var(--muted)}
.k-v{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.02em;line-height:1.2;margin-top:3px}
.k-f{display:flex;justify-content:space-between;align-items:flex-end;gap:6px;margin-top:4px}
.k-f svg{width:70px;height:24px;flex:none}
.k-x{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
.delta{font-size:12px;font-weight:500;white-space:nowrap}
.delta.up{color:var(--good-text)}.delta.down{color:var(--bad-text)}.delta.flat{color:var(--muted)}

.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.chart svg{display:block;width:100%;height:auto}
.chart text{font-family:var(--mono);font-size:10.5px;fill:var(--muted)}
.events{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--ink-2)}
.events span b{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--lemon);color:#2b1d00;font-family:var(--mono);font-size:10px;margin-right:5px}
#tip{position:fixed;z-index:80;pointer-events:none;background:var(--paper);border:1px solid var(--hair-strong);border-radius:8px;padding:8px 10px;font-size:12.5px;box-shadow:var(--shadow);min-width:150px;max-width:300px;line-height:1.45}
#tip .r{display:flex;justify-content:space-between;gap:14px;font-variant-numeric:tabular-nums}
#tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}

.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:minmax(80px,140px) 1fr 52px;align-items:center;gap:10px;font-size:13px;border:0;background:none;padding:2px 0;text-align:left;width:100%;color:inherit;border-radius:4px}
button.bar{cursor:pointer}
button.bar:hover .bl{color:var(--accent);text-decoration:underline}
.bar .bl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars.wide .bar{grid-template-columns:minmax(140px,280px) 1fr 52px}
.bars.mid .bar{grid-template-columns:minmax(110px,170px) 1fr 44px}
.bar .bt{height:10px;position:relative}
.bar .bf{display:block;height:100%;background:var(--bar);border-radius:0 4px 4px 0;min-width:2px}
.bar.dim .bf{background:var(--bar-2)}
.bar .bv{font-family:var(--mono);font-size:12px;text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums}
.pair .bt{height:7px}
.pair .two{display:flex;flex-direction:column;gap:2px}
.stack100{display:flex;gap:2px;height:14px;margin:6px 0 10px}
.stack100 span{height:100%}
.stack100 span:first-child{border-radius:4px 0 0 4px}.stack100 span:last-child{border-radius:0 4px 4px 0}
.sentnums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:12.5px}
.sentnums b{display:block;font-family:var(--display);font-size:20px;font-weight:700}

.dv{display:flex;flex-direction:column;gap:6px}
.dvh{display:grid;grid-template-columns:minmax(90px,130px) 1fr 92px;gap:10px;font-family:var(--mono);font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.dvh span:last-child{text-align:right;white-space:nowrap}
.dvr{display:grid;grid-template-columns:minmax(90px,130px) 1fr 92px;gap:10px;align-items:center;font-size:13px;border:0;background:none;padding:2px 0;text-align:left;width:100%;cursor:pointer;color:inherit}
.dvr:hover .dl{color:var(--accent);text-decoration:underline}
.dl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dt{position:relative;height:12px}
.dt::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--hair-strong)}
.df{position:absolute;top:0;height:100%}
.df.p{left:50%;background:var(--pos);border-radius:0 4px 4px 0}
.df.n{right:50%;background:var(--neg);border-radius:4px 0 0 4px}
.dvv{font-family:var(--mono);font-size:11.5px;text-align:right;color:var(--ink-2);white-space:nowrap}
.dvv b{font-weight:500;color:var(--ink)}
.dscale{display:grid;grid-template-columns:minmax(90px,130px) 1fr 92px;gap:10px;font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:4px}
.dscale div{display:flex;justify-content:space-between}

.brief{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;font-size:13.5px;line-height:1.5}
.brief li{padding-left:12px;border-left:2px solid var(--accent)}
.brief b{font-weight:600}

/* tables */
.tw{overflow-x:auto;margin:0 -4px;padding:0 4px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-family:var(--mono);font-size:10.5px;font-weight:500;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:0;border-bottom:1px solid var(--hair-strong);white-space:nowrap}
.t th button{border:0;background:none;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit;padding:8px 8px;cursor:pointer;width:100%;text-align:inherit}
.t th button:hover{color:var(--ink)}
.t th.r,.t td.r{text-align:right}
.t th[aria-sort] button{color:var(--ink)}
.t td{padding:9px 8px;border-bottom:1px solid var(--hair);vertical-align:middle}
.t td.r{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.t tbody tr[data-act]{cursor:pointer}
.t tbody tr[data-act]:hover td{background:var(--sunk)}
.t td .sub{display:block;font-size:11.5px;color:var(--muted)}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.who .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.who small{display:block;color:var(--muted);font-size:11.5px;font-weight:400;font-family:var(--mono)}
.pl{width:20px;height:20px;border-radius:5px;display:inline-grid;place-items:center;font-family:var(--mono);font-size:9.5px;font-weight:500;color:#fff;flex:none}
.pl.fb{background:#1f5fbf}.pl.ig{background:#b2367a}.pl.tt{background:#121212}.pl.x{background:#3a3a3a}.pl.yt{background:#c4302b}
.netv{font-family:var(--mono);font-size:12px}
.netv.p{color:var(--pos)}.netv.n{color:var(--neg)}
.morebar{display:flex;justify-content:center;padding-top:10px}
.cc{display:inline-block;font-family:var(--mono);font-size:10.5px;font-weight:600;border:1px solid var(--hair-strong);border-radius:4px;padding:0 4px;margin-right:6px;color:var(--ink-2);background:var(--paper)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:1px 8px;border-radius:999px;border:1px solid var(--hair-strong);background:var(--paper);color:var(--ink-2);white-space:nowrap;cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.prod{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.chip.tag{font-family:var(--mono);font-size:11px}
.pill{font-family:var(--mono);font-size:10.5px;padding:1px 7px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill.pos{color:var(--pos)}.pill.neg{color:var(--neg)}.pill.neu{color:var(--ink-2)}
.tg{font-family:var(--mono);font-size:10.5px;padding:1px 6px;border-radius:4px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.flag{font-family:var(--mono);font-size:10.5px;padding:1px 6px;border-radius:4px;white-space:nowrap;background:color-mix(in oklab,var(--critical) 14%,transparent);color:var(--bad-text)}
.flag.lead{background:var(--lemon-soft);color:var(--ink)}
.real{font-family:var(--mono);font-size:10px;padding:0 6px;border-radius:4px;background:var(--lemon-soft);color:var(--ink);border:1px solid color-mix(in oklab,var(--lemon) 60%,transparent);white-space:nowrap}
.demo-chip{font-family:var(--mono);font-size:10px;padding:0 6px;border-radius:4px;border:1px dashed var(--hair-strong);color:var(--muted);white-space:nowrap}

/* post cards */
.plist{display:flex;flex-direction:column;gap:10px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.pc{background:var(--paper);border:1px solid var(--hair);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pc-h{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap;font-size:12.5px;min-width:0}
.pc-h .au{font-weight:600;border:0;background:none;padding:0;cursor:pointer;color:var(--ink);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-h .au:hover,.pc-h .gr:hover{color:var(--accent);text-decoration:underline}
.pc-h .gr{border:0;background:none;padding:0;cursor:pointer;color:var(--ink-2)}
.pc-h .when{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.pc-t{margin:0;font-size:14px;line-height:1.55;overflow-wrap:anywhere}
.pc-c{display:flex;gap:5px;flex-wrap:wrap}
.pc-m{font-size:12px;color:var(--muted)}
.pc-f{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink-2);border-top:1px solid var(--hair);padding-top:8px}
.pc-f .m{font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--muted)}
.pc-f a{margin-left:auto;font-size:12.5px;white-space:nowrap;font-weight:500}

/* posts toolbar */
.ptools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 240px;min-width:0;display:flex;align-items:center;gap:6px;border:1px solid var(--hair-strong);background:var(--paper);border-radius:8px;padding:5px 10px}
.search input{border:0;background:none;outline:none;width:100%;min-width:0;font-size:13.5px}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.activef{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--ink-2)}
.resbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}

/* tiles row */
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.tile{background:var(--surface);border:1px solid var(--hair);border-radius:12px;padding:12px 14px;min-width:0}
button.tile,a.tile{cursor:pointer;text-align:left;color:inherit;text-decoration:none}
button.tile:hover,a.tile:hover{border-color:var(--accent)}
.tile .k-v{font-size:22px}
.tiles.seven{grid-template-columns:repeat(7,minmax(0,1fr))}
.tiles.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.t td.nw{white-space:nowrap}
.tile p{margin:2px 0 0;font-size:12px;color:var(--muted)}

/* products */
.pcards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.pcard{background:var(--surface);border:1px solid var(--hair);border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;color:inherit}
.pcard:hover{border-color:var(--accent)}
.pcard[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.pcard .hd{display:flex;justify-content:space-between;align-items:center;gap:6px}
.pcard .nm{font-weight:600;font-size:14px}
.pcard .ar{font-size:12.5px;color:var(--muted)}
.pcard .row{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.pcard .k-v{font-size:22px}
.pcard svg{width:76px;height:26px}
.pcard .ft{font-size:12px;color:var(--ink-2);border-top:1px solid var(--hair);padding-top:6px;margin-top:4px}
.dd-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.dd-head h2{font-family:var(--display);font-size:22px;margin:0;letter-spacing:-.01em}

/* clusters */
.cl{display:flex;flex-direction:column}
.clr{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-top:1px solid var(--hair)}
.clr:first-child{border-top:0;padding-top:2px}
.clr .lb{font-weight:600;font-size:13.5px}
.clr .ct{font-family:var(--mono);font-size:13px;text-align:right;white-space:nowrap}
.clr .ex{grid-column:1/-1;font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clr .ac{grid-column:1/-1;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.clr .ac .linkbtn{margin-left:auto;font-size:12.5px}

/* heatmap */
.hm{display:grid;grid-template-columns:44px repeat(8,minmax(0,1fr));gap:3px;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.hm div{display:grid;place-items:center;height:26px;border-radius:4px}
.hm .c{color:transparent}
.hm .c:hover{color:var(--ink)}
.hm .hl{outline:2px solid var(--lemon);outline-offset:-2px}

/* cloud */
.cloud{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;line-height:1.2}
.cloud button{border:0;background:none;padding:0;cursor:pointer;color:var(--ink-2)}
.cloud button:hover{color:var(--accent);text-decoration:underline}

/* alerts */
.alist{display:flex;flex-direction:column;gap:10px}
.al{display:grid;grid-template-columns:auto 1fr auto;gap:10px 12px;align-items:start;padding:12px 14px;border:1px solid var(--hair);border-radius:10px;background:var(--paper)}
.sev{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:500;white-space:nowrap;padding-top:2px}
.sev svg{width:14px;height:14px}
.sev.critical{color:var(--critical)}.sev.warning{color:color-mix(in oklab,var(--warning) 70%,var(--ink))}.sev.good{color:var(--good-text)}
.al .t1{font-weight:600}
.al .t2{font-size:13px;color:var(--ink-2);margin-top:2px}
.al .when{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.rules{display:flex;flex-direction:column}
.rule{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:11px 0;border-top:1px solid var(--hair);font-size:13.5px}
.rule:first-child{border-top:0}
.rule small{display:block;color:var(--muted);font-size:12px}
.switch{position:relative;width:36px;height:20px;border-radius:999px;border:0;background:var(--hair-strong);cursor:pointer;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--paper);transition:left .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{left:19px}

/* outside Egypt */
.xhead{display:flex;justify-content:space-between;align-items:flex-end;gap:8px 16px;flex-wrap:wrap;border-bottom:1px solid var(--hair)}
.subtabs{display:flex;gap:2px;flex-wrap:wrap;margin-bottom:-1px}
.subtabs button{border:0;background:none;padding:9px 12px;font-size:13.5px;color:var(--ink-2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.subtabs button:hover{color:var(--ink)}
.subtabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.xmk{display:flex;align-items:center;gap:8px;font-size:12.5px;padding-bottom:8px}
.facts{background:var(--lemon-soft);border-color:color-mix(in oklab,var(--lemon) 45%,transparent)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px 22px}
.fv{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.02em;line-height:1.1}
.fl{font-size:13px;color:var(--ink-2);margin:3px 0 4px}
.fs{font-size:12px}
.tm-wrap{overflow-x:auto;padding:2px 2px 4px}
.tm{display:grid;grid-template-columns:repeat(17,minmax(34px,1fr));grid-template-rows:repeat(7,42px);gap:4px;min-width:620px}
.tm-t{border:1px solid var(--hair);border-radius:6px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--mono);cursor:pointer;color:var(--ink);padding:0;line-height:1.15}
.tm-t b{font-size:11.5px;font-weight:600}
.tm-t span{font-size:9.5px;opacity:.85}
.tm-t.z{border-style:dashed;color:var(--muted);background:transparent}
.tm-t.home{background:var(--lemon-soft);border-color:var(--lemon);cursor:default}
.tm-t:not(.home):hover{outline:2px solid var(--accent);outline-offset:1px}
.tm-t.sel{outline:2px solid var(--ink);outline-offset:1px}
.ramp{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.ramp i{display:block;width:110px;height:8px;border-radius:4px;background:linear-gradient(90deg,color-mix(in oklab,var(--accent) 15%,var(--surface)),var(--accent))}

/* rumor radar */
.ccards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.ccard{background:var(--surface);border:1px solid var(--hair);border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;color:inherit;min-width:0}
.ccard:hover{border-color:var(--accent)}
.ccard[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.ccard.muted{opacity:.62}
.ccard-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.risk{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:500;white-space:nowrap}
.risk svg{width:14px;height:14px}
.risk.high{color:var(--critical)}.risk.medium{color:color-mix(in oklab,var(--warning) 70%,var(--ink))}.risk.low{color:var(--good-text)}
.cst{font-family:var(--mono);font-size:10.5px;padding:1px 7px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.cst.spreading{color:var(--critical)}.cst.active{color:color-mix(in oklab,var(--warning) 70%,var(--ink))}.cst.slowing{color:var(--ink-2)}
.cst.contained,.cst.ended{color:var(--good-text)}.cst.handled,.cst.dismissed{color:var(--muted)}
.ccard-title{font-weight:600;font-size:14.5px;line-height:1.3}
.ccard-type{font-size:12px;color:var(--muted)}
.ccard-row{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;font-size:12.5px;color:var(--ink-2)}
.ccard-row svg{width:70px;height:24px;flex:none}
.ccard-foot{font-size:12px;color:var(--ink-2);border-top:1px solid var(--hair);padding-top:6px}
.claim{display:grid;grid-template-columns:1fr 1fr;gap:6px 22px;margin-top:14px;padding:12px 14px;border:1px solid var(--hair);border-radius:10px;background:var(--paper)}
.claim p{margin:3px 0 0;font-size:14px;line-height:1.5}
.claim .k-l{display:block}
.resp-note{font-size:13px;color:var(--ink-2);margin:10px 0 0;padding:8px 10px;border-radius:8px;background:var(--sunk)}
.resp-note.warn{background:color-mix(in oklab,var(--critical) 10%,transparent);color:var(--bad-text)}
.cscore{display:flex;align-items:center;gap:10px}
.cscore .meter{flex:1;height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.cscore .meter span{display:block;height:100%}
.cscore b{font-family:var(--mono);font-size:12.5px}
.hint-line{font-size:12.5px;color:var(--ink-2);margin:4px 0 12px}
.reasons{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.reasons li{display:grid;grid-template-columns:86px 1fr;gap:8px;align-items:start}
.reasons .ri{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;padding:1px 6px;border-radius:4px;white-space:nowrap;margin-top:2px;text-align:center}
.reasons .ri.hit{background:color-mix(in oklab,var(--critical) 14%,transparent);color:var(--bad-text)}
.reasons .ri.ok{background:var(--sunk);color:var(--muted)}
.ba{display:grid;grid-template-columns:50px 1fr;gap:8px;align-items:center;font-size:12px;color:var(--ink-2)}
.ba .stack100{margin:4px 0}
.reply{border:1px solid var(--hair);border-radius:10px;background:var(--paper);padding:12px;display:flex;flex-direction:column;gap:8px}
.reply p{margin:0;font-size:14px;line-height:1.65}
.actions{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;font-size:13.5px}
.actions label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.actions input{margin-top:3px}
.howto{margin:0;padding-left:20px;font-size:13.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:6px}
button.flag{border:0;cursor:pointer;display:inline-flex;align-items:center;gap:4px;font:inherit;font-family:var(--mono);font-size:10.5px}
button.flag:hover{text-decoration:underline}
.flag.def{background:color-mix(in oklab,var(--pos) 14%,transparent);color:var(--pos)}
.flag.ask{background:var(--sunk);color:var(--ink-2)}
.flag svg{width:11px;height:11px;flex:none}
@media (max-width:820px){.claim{grid-template-columns:1fr}.reasons li{grid-template-columns:1fr}}

/* drawer + chat */
#scrim{position:fixed;inset:0;background:rgba(8,16,17,.38);z-index:60}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100vw);background:var(--ground);border-left:1px solid var(--hair-strong);z-index:70;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.dr-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:calc(16px + env(safe-area-inset-top,0px)) 18px 14px;border-bottom:1px solid var(--hair);background:var(--paper)}
.dr-h h3{margin:0;font-family:var(--display);font-size:20px;letter-spacing:-.01em;line-height:1.2}
.dr-h .meta{font-size:12.5px;color:var(--muted);margin-top:4px}
.x{border:1px solid var(--hair-strong);background:var(--paper);border-radius:8px;width:32px;height:32px;cursor:pointer;flex:none;font-size:16px;line-height:1}
.dr-b{overflow-y:auto;padding:16px 18px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.dr-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dr-actions{display:flex;gap:8px;flex-wrap:wrap}
.help h4{margin:6px 0 6px;font-size:13px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.help dl{margin:0;display:flex;flex-direction:column;gap:9px}
.help dt{font-weight:600;font-size:13.5px}
.help dd{margin:1px 0 0;color:var(--ink-2);font-size:13.5px}
.help p{margin:0;font-size:13.5px;color:var(--ink-2)}
.chat-log{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:90%;padding:10px 12px;border-radius:12px;font-size:13.5px;line-height:1.55}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:3px}
.msg.bot{align-self:flex-start;background:var(--paper);border:1px solid var(--hair);border-bottom-left-radius:3px}
.msg.bot ul{margin:6px 0 0;padding-left:18px}
.msg.bot li{margin-bottom:3px}
.chat-foot{border-top:1px solid var(--hair);padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;background:var(--paper)}
.sugg{display:flex;gap:6px;flex-wrap:wrap}
.sugg button{border:1px solid var(--hair-strong);background:var(--paper);border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer;text-align:left}
.sugg button:hover{border-color:var(--accent);color:var(--accent)}
.askf{display:flex;gap:8px}
.askf input{flex:1;min-width:0;border:1px solid var(--hair-strong);border-radius:8px;padding:8px 12px;background:var(--paper);font-size:14px}

.empty{padding:18px;text-align:center;color:var(--muted);font-size:13.5px;border:1px dashed var(--hair-strong);border-radius:10px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:8px;font-size:13px;z-index:90}

/* responsive */
@media (max-width:1280px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.tiles.seven{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:1100px){
  .s3{grid-column:span 6}.s4,.s5,.s6,.s7,.s8{grid-column:span 12}
}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:8px 12px;border-right:0;border-bottom:1px solid var(--hair);gap:4px}
  .brand{padding:4px 8px 4px 2px;font-size:16px}
  .side-sec,.side .grow,.side-foot{display:none}
  .nav{width:auto;padding:6px 10px}
  .top{position:static;padding:12px 16px}
  #content{padding:16px 16px 48px}
  .s3{grid-column:span 12}
  .dr-cols{grid-template-columns:1fr}
}
@media (max-width:560px){
  .kpis,.tiles.seven,.tiles.four{grid-template-columns:repeat(2,minmax(0,1fr))}
  .k-v{font-size:22px}
  .k-f svg{display:none}
  .al{grid-template-columns:1fr}
  .subtabs{flex-wrap:nowrap;overflow-x:auto;width:100%}
  .xmk{width:100%}
  .xmk .sel{flex:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

function sortTable(id,cols,rows,o){
  var st=state.sorts[id]||(state.sorts[id]={k:o.sort,dir:-1});
  var col=cols.filter(function(c){return c.k===st.k;})[0]||cols[0];
  var sv=col.sv||function(r){return r[col.k];};
  var isStr=rows.length>0&&typeof sv(rows[0])==='string',sign=st.dir===-1?1:-1;
  rows=rows.slice().sort(function(a,b){var x=sv(a),y=sv(b);if(isStr)return sign*String(x).localeCompare(String(y));return sign*((y==null?-1e18:y)-(x==null?-1e18:x));});
  var lim=state.limits[id]||o.limit||40,shown=rows.slice(0,lim);
  var h='<div class="tw"><table class="t"><thead><tr>'+cols.map(function(c){
    var srt=c.k===st.k?((st.dir===-1)!==isStr?'descending':'ascending'):null;
    return '<th class="'+(c.r?'r':'')+'"'+(srt?' aria-sort="'+srt+'"':'')+' scope="col">'+(c.nosort?'<span style="display:block;padding:8px">'+c.l+'</span>':'<button type="button" data-act="sort" data-k="'+id+'" data-v="'+c.k+'" title="Sort by '+esc(c.l)+'">'+c.l+(srt?(srt==='descending'?' ↓':' ↑'):'')+'</button>')+'</th>';
  }).join('')+'</tr></thead><tbody>'+shown.map(function(r){
    return '<tr'+(o.act?' data-act="'+o.act+'" data-v="'+esc(o.rid(r))+'" tabindex="0"':'')+'>'+cols.map(function(c){return '<td class="'+(c.r?'r':'')+(c.nw?' nw':'')+'">'+(c.f?c.f(r):esc(r[c.k]))+'</td>';}).join('')+'</tr>';
  }).join('')+'</tbody></table></div>';
  if(!rows.length)h+='<div class="empty" style="margin-top:10px">Nothing matches these filters.</div>';
  if(rows.length>lim)h+='<div class="morebar"><button type="button" class="btn" data-act="more" data-k="'+id+'">Show all '+rows.length+'</button></div>';

}

function niceStep(v){var p=Math.pow(10,Math.floor(Math.log10(v||1))),n=v/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p;}
function eventsInRange(c){

function timeChart(host,list,c){

  var W=Math.max(320,Math.round(host.clientWidth||760)),H=W<520?200:230,m={t:16,r:6,b:24,l:34},iw=W-m.l-m.r,ih=H-m.t-m.b;
  var mx=Math.max.apply(null,days.map(function(x){return x.t;}))||1,step=niceStep(mx/4),top=Math.ceil(mx/step)*step;
  var NS='http://www.w3.org/2000/svg',svg=document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox','0 0 '+W+' '+H);svg.setAttribute('role','img');svg.setAttribute('aria-label','Daily posts by sentiment');
  var s='';
  for(var t=0;t<=top;t+=step){var y=m.t+ih-t/top*ih;s+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+y+'" y2="'+y+'" stroke="'+(t===0?'var(--hair-strong)':'var(--hair)')+'"/><text x="'+(m.l-6)+'" y="'+(y+3.5)+'" text-anchor="end">'+compact(t)+'</text>';}
  var bw=iw/n,gap=n>60?1:Math.max(1.5,bw*.25),w=Math.max(1,bw-gap);
  var evs=eventsInRange(c);
  evs.forEach(function(e,k){var x=m.l+(e.d-c.from)*bw+bw/2;s+='<line x1="'+x+'" x2="'+x+'" y1="'+(m.t-2)+'" y2="'+(m.t+ih)+'" stroke="var(--lemon)" stroke-dasharray="3 3"/><circle cx="'+x+'" cy="'+(m.t-4)+'" r="7" fill="var(--lemon)"/><text x="'+x+'" y="'+(m.t-0.6)+'" text-anchor="middle" style="fill:#2b1d00;font-size:9.5px">'+(k+1)+'</text>';});
  days.forEach(function(x,i){
    var bx=m.l+i*bw+gap/2,yb=m.t+ih;
    [['pos','var(--pos)'],['neu','var(--neu)'],['neg','var(--neg)']].forEach(function(sg,j){
      var h=x[sg[0]]/top*ih;if(h<=0)return;var hh=Math.max(0,h-(j<2&&x.t>x[sg[0]]&&n<=60?1.5:0));
      s+='<rect x="'+bx.toFixed(1)+'" y="'+(yb-h).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+hh.toFixed(1)+'" fill="'+sg[1]+'"/>';yb-=h;
    });
    s+='<rect class="hit" data-i="'+i+'" x="'+(m.l+i*bw).toFixed(1)+'" y="'+m.t+'" width="'+bw.toFixed(1)+'" height="'+ih+'" fill="transparent"/>';
    var every=n<=7?1:n<=30?5:15;
    if(i%every===0)s+='<text x="'+(m.l+i*bw+bw/2).toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle">'+fmtD(x.d)+'</text>';
  });
  svg.innerHTML=s;host.innerHTML='';host.appendChild(svg);
  svg.addEventListener('mousemove',function(e){
    var r=e.target.closest&&e.target.closest('.hit');if(!r){hideTip();return;}
    var x=days[+r.getAttribute('data-i')],ev=evs.filter(function(v){return v.d===x.d;})[0];

      '<div class="r"><span><i style="background:var(--pos)"></i>Positive</span><span>'+x.pos+'</span></div>'+
      '<div class="r"><span><i style="background:var(--neu)"></i>Neutral</span><span>'+x.neu+'</span></div>'+

function lineChart(host,vals,startD,label){

  var W=Math.max(300,Math.round(host.clientWidth||640)),H=180,m={t:12,r:10,b:24,l:40},iw=W-m.l-m.r,ih=H-m.t-m.b,n=vals.length;

function insights(c){
  var cs=stats(c.cur),ps=stats(c.prev),out=[];
  var ch=dPct(cs.n,ps.n);
  var pc=countBy(c.cur,function(p){return p.prods[0]==='ALL'?[]:p.prods;}),pp=countBy(c.prev,function(p){return p.prods[0]==='ALL'?[]:p.prods;});
  var mover=null;Object.keys(pc).forEach(function(k){if(state.products.length===1)return;var dl=pc[k]-(pp[k]||0);if(!mover||dl>mover.dl)mover={k:k,dl:dl,c:pc[k],p:pp[k]||0};});
  out.push('<b>'+fmtN(cs.n)+' posts</b> from '+fmtN(cs.authors)+' accounts, '+(ch==null?'with no earlier period to compare.':(ch>=0?'up ':'down ')+Math.abs(Math.round(ch))+'% on the previous '+c.r+' days.')+
    (mover&&mover.dl>0?' The biggest gain is <b>'+esc(PROD[mover.k].en)+'</b> ('+(mover.p?'+'+Math.round(dPct(mover.c,mover.p))+'%':'new this period')+').':''));
  var negT=topE(countBy(c.cur.filter(function(p){return p.s==='neg';}),function(p){return CL[p.c].topic;}),1)[0];
  if(negT){
    var tg=topE(countBy(c.cur.filter(function(p){return p.s==='neg'&&CL[p.c].topic===negT[0];}),function(p){return p.gov;}),1)[0];
    out.push('Net sentiment is <b>'+signed(cs.net)+'</b> ('+signed(cs.net-ps.net)+' pts). The main negative driver is <b>'+esc(negT[0].toLowerCase())+'</b>: '+negT[1]+' posts, most from '+esc(tg[0])+'.');
  }
  var q=topE(countBy(c.cur.filter(function(p){return CL[p.c].g==='Questions'&&CL[p.c].intent!=='Sales lead';}),function(p){return p.c;}),1)[0];
  if(q)out.push('Most asked: <b>“'+esc(CL[q[0]].label)+'”</b> ('+q[1]+' posts). '+c.cur.filter(function(p){return p.needsReply&&!p.replied;}).length+' questions and complaints have no reply from V7 yet.');
  var tc=countBy(c.cur,function(p){return p.tags;}),tp=countBy(c.prev,function(p){return p.tags;}),rise=null;
  Object.keys(tc).forEach(function(k){if(tc[k]<5)return;var r=tc[k]/((tp[k]||0)+2);if(!rise||r>rise.r)rise={k:k,r:r,c:tc[k],p:tp[k]||0};});
  if(rise)out.push('Fastest-growing hashtag: <b>'+htag(rise.k)+'</b>, '+rise.c+' posts vs '+rise.p+' before.');
  var big=c.cur.filter(function(p){var a=AUTH[p.a];return a.type!=='official'&&a.followers>=1e5;}).sort(function(a,b){return b.views-a.views;});
  if(big.length)out.push('<b>'+plural(big.length,'post')+'</b> came from accounts with 100K+ followers. The biggest was '+bd(AUTH[big[0].a].name)+' ('+compact(big[0].views)+' views).');
  var leads=c.cur.filter(function(p){return CL[p.c].intent==='Sales lead';}).length;
  if(leads)out.push('<b>'+leads+(leads===1?' shop or café':' shops and cafés')+'</b> asked how to stock V7. Pass these to the sales team (Customer voice → Sales leads).');
  var hot=CAMPS.filter(function(cp){return campActive(cp.id)&&CINFO[cp.id].level==='High'&&CINFO[cp.id].L.some(function(p){return p.cty==='EG';});}).sort(function(a,b){return CINFO[b.id].score-CINFO[a.id].score;})[0];
  if(hot){var hi=CINFO[hot.id];out.unshift('<b style="color:var(--bad-text)">Rumor radar:</b> '+esc(hot.title)+' is '+campStatus(hot.id).toLowerCase()+' ('+plural(hi.L.length,'post')+', '+compact(hi.views)+' views). <button type="button" class="linkbtn" style="padding:0" data-act="camp" data-v="'+hot.id+'">Review it →</button>');}
  return out;
}

  var lc=countBy(lastW,function(p){return p.gov;}),pc=countBy(prevW,function(p){return p.gov;});
  Object.keys(lc).forEach(function(g){if(lc[g]>=5&&lc[g]>=2*(pc[g]||0))out.push({sev:'critical',d:NDAYS-1,t1:'Availability problem in '+esc(g),t2:lc[g]+' “can’t find it” posts this week vs '+(pc[g]||0)+' last week.',act:['gov',g]});});
  base.filter(function(p){var a=AUTH[p.a];return p.d>NDAYS-8&&a.type!=='official'&&a.followers>=1e5;}).sort(function(a,b){return b.views-a.views;}).slice(0,3).forEach(function(p){

    return '<li><b>'+esc(p.en)+'</b> (launched '+fmtD(D(p.launch))+'): '+s.n+' posts, net sentiment '+signed(s.net)+'. '+tr+' people praised the taste; '+pct(gap,s.n)+'% of posts are about not finding it.</li>';}).join('')+'</ul>';}
  if(kind==='fans'){var r=authorRows(L).filter(function(x){return x.n>=2&&x.neg===0;}).sort(function(a,b){return b.n-a.n||b.eng-a.eng;}).slice(0,5);if(!r.length)return 'No repeat fans'+scope+' yet.';
    return 'Biggest fans'+scope+':<ul>'+r.map(function(x){return '<li>'+bd(x.a.name)+' ('+PL[x.a.pl].n+', '+esc(x.a.gov)+'): '+x.n+' posts, none negative.</li>';}).join('')+'</ul>Consider inviting them to a sampling event or a fan feature.';}
  if(kind==='reply'){var u=L.filter(function(p){return p.needsReply&&!p.replied;}).sort(function(a,b){return b.views-a.views;}).slice(0,4);if(!u.length)return 'Nothing is waiting for a reply.';
    return 'The most visible posts still waiting for a reply:<ul>'+u.map(function(p){return '<li>“'+bd(p.text)+'” by '+bd(AUTH[p.a].name)+', '+compact(p.views)+' views. <a href="'+esc(p.url)+'" target="_blank" rel="noopener">Open ↗</a></li>';}).join('')+'</ul>';}
  if(kind==='rumors'){var act=CAMPS.filter(function(cp){return campActive(cp.id);}).sort(function(a,b){return CINFO[b.id].score-CINFO[a.id].score;});
    if(!act.length)return 'No active false campaigns right now.';
    return 'Possible false campaigns:<ul>'+act.map(function(cp){var ci=CINFO[cp.id];return '<li><b>'+esc(cp.title)+'</b>: '+ci.level.toLowerCase()+' risk, '+campStatus(cp.id).toLowerCase()+', '+plural(ci.L.length,'post')+', '+compact(ci.views)+' views. '+(ci.sig.score>=60?'Likely coordinated. ':'')+(ci.resp?'V7 responded on '+fmtD(ci.resp.d)+'.':'No response from V7 yet.')+'</li>';}).join('')+'</ul>Open <b>Rumors &amp; attacks</b> for the evidence and a suggested reply.';}
  if(kind==='abroad'){var x=ctxX(),A=x.cur,AP=x.prev;if(!A.length)return 'No posts from '+(state.xmk==='all'?'outside Egypt':esc(marketLabel()))+' in this period.';
    var top=topE(countBy(A,function(p){return p.cty;}),5),q=topE(countBy(A.filter(function(p){return CL[p.c].g==='Questions'&&p.c!=='x_import';}),function(p){return p.c;}),1)[0],leads=A.filter(function(p){return p.c==='x_import';}).length;
    return fmtN(A.length)+' posts from '+(state.xmk==='all'?'outside Egypt':esc(marketLabel()))+' in the last '+x.r+' days ('+(AP.length?(A.length>=AP.length?'up ':'down ')+Math.abs(Math.round(dPct(A.length,AP.length)))+'%':'new')+'). Top countries:<ul>'+top.map(function(e){return '<li>'+esc(COUNTRY[e[0]].en)+': '+e[1]+' posts</li>';}).join('')+'</ul>'+pct(A.filter(function(p){return p.seg==='diaspora';}).length,A.length)+'% come from Egyptians living abroad.'+(q?' Most asked: “'+esc(CL[q[0]].label)+'”.':'')+' '+leads+' importers or shops asked how to stock V7. Open <b>Outside Egypt</b> for details.';}
  return '';
}
function classify(q){q=q.toLowerCase();
  if(/rumou?r|fake|false|attack|scam|boycott|lie|coca|كوكاكولا|إشاعة|اشاعة|نصب|مقاطعة/.test(q))return 'rumors';
  if(/abroad|outside|international|export|countr|saudi|kuwait|uk|usa|gulf|خارج|تصدير|السعودية|الكويت|الخليج/.test(q))return 'abroad';
  if(/complain|negative|problem|شكو|مشكل|سلبي/.test(q))return 'complaints';
  if(/where|find|stock|availab|buy|فين|متوفر|ألاقي/.test(q))return 'where';
  if(/new|launch|malt|شعير|جديد/.test(q))return 'new';
  if(/fan|advoca|influenc|creator|loyal/.test(q))return 'fans';
  if(/reply|respond|answer|رد/.test(q))return 'reply';
  if(/summar|overview|week|month|happen|ملخص/.test(q))return 'summary';
  return null;}
var chatLog=document.getElementById('chatLog');
function say(cls,html){var m=document.createElement('div');m.className='msg '+cls;m.innerHTML=html;chatLog.appendChild(m);chatLog.scrollTop=chatLog.scrollHeight;}
function ask(kindOrText,isText){
  say('me',esc(isText?kindOrText:SUGG.filter(function(s){return s[0]===kindOrText;})[0][1]));
  var k=isText?classify(kindOrText):kindOrText;
  setTimeout(function(){say('bot',k?answer(k):'In the live version I can answer any question from your posts. In this demo I can summarize the period, list complaints, show where people can’t find V7, check new products, name your biggest fans, list posts that need a reply, or summarize activity outside Egypt.');},250);
}

});

platChips.innerHTML='<button type="button" class="pchip" data-pl="all" aria-pressed="true">All platforms</button>'+Object.keys(PL).map(function(k){return '<button type="button" class="pchip" data-pl="'+k+'" aria-pressed="false">'+PL[k].n+'</button>';}).join('');
platChips.addEventListener('click',function(e){var b=e.target.closest('[data-pl]');if(!b)return;var k=b.getAttribute('data-pl');
  if(k==='all')state.platforms=[];else{var i=state.platforms.indexOf(k);if(i>=0)state.platforms.splice(i,1);else state.platforms.push(k);if(state.platforms.length===Object.keys(PL).length)state.platforms=[];}
  state.pfPage=1;state.pfxPage=1;render();});
document.getElementById('rangeSeg').addEventListener('click',function(e){var b=e.target.closest('[data-r]');if(!b)return;state.range=+b.getAttribute('data-r');state.pfPage=1;state.pfxPage=1;render();});
document.getElementById('sourceSel').addEventListener('change',function(e){state.source=e.target.value;render();});

var prodBtn=document.getElementById('prodBtn'),prodPop=document.getElementById('prodPop');
document.getElementById('prodList').innerHTML='<div class="pop-sec">V7 vitamin sparkling</div>'+PRODUCTS.filter(function(p){return p.line==='v7';}).map(prodOption).join('')+'<div class="pop-sec">V Cola line</div>'+PRODUCTS.filter(function(p){return p.line==='vcola';}).map(prodOption).join('');
function prodOption(p){return '<label><input type="checkbox" value="'+p.id+'" id="pc_'+p.id+'"> '+esc(p.en)+(p.status!=='core'?' <span class="st '+p.status+'">'+STATUS[p.status]+'</span>':'')+'<span class="ar">'+esc(p.ar)+'</span></label>';}
prodBtn.addEventListener('click',function(e){e.stopPropagation();var o=prodPop.hidden;prodPop.hidden=!o;prodBtn.setAttribute('aria-expanded',String(o));});
prodPop.addEventListener('change',function(e){var v=e.target.value,i=state.products.indexOf(v);if(e.target.checked&&i<0)state.products.push(v);if(!e.target.checked&&i>=0)state.products.splice(i,1);state.dd=null;render();});
document.getElementById('prodAll').addEventListener('click',function(){state.products=[];state.dd=null;render();});
document.getElementById('prodNew').addEventListener('click',function(){state.products=PRODUCTS.filter(function(p){return p.status==='new';}).map(function(p){return p.id;});state.dd=null;render();});

function go(v){state.view=v;render();window.scrollTo(0,0);}
function goPosts(k,v){state.pf=blankPF();if(k)state.pf[k]=v;state.pfPage=1;closePanels();go('posts');}
function goXPosts(k,v,m){state.pfx=blankPF();if(k)state.pfx[k]=v;if(m)state.xmk=m;state.pfxPage=1;state.xtab='posts';closePanels();go('abroad');}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(function(){t.hidden=true;},2400);}
function csv(list){
  var rows=[['date','time','platform','author','author_type','group','country','city','products','sentiment','type_of_post','topic','language','views','likes','comments','shares','hashtags','url','text']];
  list.forEach(function(p){var a=AUTH[p.a];rows.push([dt(p.d).toISOString().slice(0,10),String(p.h).padStart(2,'0')+':'+String(p.mi).padStart(2,'0'),PL[p.pl].n,a.name,authorKind(a),p.g?GRP[p.g].name:'',p.cty==='EG'?'Egypt':COUNTRY[p.cty].en,p.gov,p.prods.map(prodLabel).join(' + ')||'No flavor named',p.s,CL[p.c].intent,CL[p.c].topic,LANG[p.lang]||p.lang,p.views,p.likes,p.comments,p.shares,p.tags.join(' '),p.url,p.text]);});
  return rows.map(function(r){return r.map(function(x){x=String(x);return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x;}).join(',');}).join('\n');
}
function onAct(e){
  var el=e.target.closest('[data-act]');if(!el||el.tagName==='A')return;
  var a=el.getAttribute('data-act'),k=el.getAttribute('data-k'),v=el.getAttribute('data-v'),m=el.getAttribute('data-m');
  switch(a){
    case 'person':openPerson(v);break;
    case 'group':openGroup(v);break;
    case 'tag':openTag(v);break;
    case 'country':openCountry(v);break;
    case 'view':if(v)go(v);break;
    case 'posts':goPosts(k,v);break;
    case 'xposts':goXPosts(k,v,m);break;
    case 'xcountryposts':goXPosts('','',v);break;
    case 'posts-gov':goPosts('gov',v);break;
    case 'search':goPosts('q',v);break;
    case 'xsearch':goXPosts('q',v);break;
    case 'xtab':state.xtab=v;state.view='abroad';render();window.scrollTo(0,0);break;
    case 'xmk':state.xmk=v;state.pfxPage=1;closePanels();state.view='abroad';render();toast('Outside Egypt now shows: '+marketLabel());break;
    case 'xseg':state.xPeopleSeg=v;render();break;
    case 'setprod':state.products=[v];state.dd=v;closePanels();render();toast('Showing only '+prodLabel(v)+' across the dashboard');break;
    case 'clearprod':state.products=[];render();toast('Showing all products again');break;
    case 'dd':state.dd=v;render();var hd=content.querySelector('.dd-head');if(hd)hd.scrollIntoView({block:'start',behavior:'smooth'});break;
    case 'sort':var st=state.sorts[k]||(state.sorts[k]={k:v,dir:-1});if(st.k===v)st.dir*=-1;else{st.k=v;st.dir=-1;}render();break;
    case 'more':state.limits[k]=1e9;render();break;
    case 'seg':state.peopleSeg=v;render();break;
    case 'pfclear':state[k||'pf'][v]='';state[(k||'pf')+'Page']=1;render();break;
    case 'pfreset':state[k||'pf']=blankPF();state[(k||'pf')+'Page']=1;render();break;
    case 'pfmore':state[(k||'pf')+'Page']++;render();break;
    case 'rule':el.setAttribute('aria-checked',el.getAttribute('aria-checked')!=='true');RULES[+v][2]=el.getAttribute('aria-checked')==='true';toast(RULES[+v][0]+(RULES[+v][2]?' alerts on':' alerts off'));break;
    case 'alert':if(k==='person')openPerson(v);else if(k==='gov')goPosts('gov',v);else if(k==='cluster')goPosts('cluster',v);else if(k==='xcluster')goXPosts('cluster',v);else if(k==='country')openCountry(v);else if(k==='camp'){state.selCamp=v;state.view='radar';render();window.scrollTo(0,0);}else if(k==='day'){state.range=(NDAYS-1-Number(v))<7?7:30;go('overview');}break;
    case 'selcamp':state.selCamp=v;render();var cd=document.getElementById('cdetail');if(cd)cd.scrollIntoView({block:'start',behavior:'smooth'});break;
    case 'camp':state.selCamp=v;closePanels();state.view='radar';render();window.scrollTo(0,0);var cd2=document.getElementById('cdetail');if(cd2)cd2.scrollIntoView({block:'start'});break;
    case 'camphandled':state.campOver[v]='Handled';render();toast('Marked as handled');break;
    case 'campdismiss':state.campOver[v]='Dismissed';render();toast('Marked as not a false campaign. In the live version this improves detection.');break;
    case 'campreset':delete state.campOver[v];render();toast('Campaign reopened');break;
    case 'campmore':state.campLim[v]=1e9;render();break;
    case 'copyreply':
      var rt=CAMP[v].reply[k],okc=function(){toast('Reply copied');};
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(rt).then(okc,function(){fallbackCopy(rt);});}else fallbackCopy(rt);
      break;
    case 'copycsv':
      var list=state['_list_'+(k||'pf')]||[],text=csv(list);
      var done=function(){toast('Copied '+list.length+' posts. Paste into Excel or Google Sheets.');};
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done,function(){fallbackCopy(text);});}else fallbackCopy(text);
      break;
  }
}
function fallbackCopy(text){openDrawer('Copy for Excel','Select all, copy, then paste into Excel or Google Sheets','<textarea id="csvta" style="width:100%;height:60vh;font-family:var(--mono);font-size:11px;border:1px solid var(--hair-strong);border-radius:8px;padding:8px;background:var(--paper)" aria-label="Posts as CSV">'+esc(text)+'</textarea>');var ta=document.getElementById('csvta');ta.focus();ta.select();}

var VIEWS={radar:vRadar,overview:vOverview,posts:vPosts,products:vProducts,voice:vVoice,people:vPeople,groups:vGroups,hashtags:vHashtags,owned:vOwned,alerts:vAlerts,abroad:vAbroad};
function render(){
  hideTip();HOOKS=[];
  var c=ctxGet();
  document.querySelectorAll('.side .nav').forEach(function(b){if(b.getAttribute('data-view')===state.view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  document.getElementById('vTitle').textContent=TITLES[state.view];
  document.querySelectorAll('#rangeSeg [data-r]').forEach(function(b){b.setAttribute('aria-pressed',String(+b.getAttribute('data-r')===state.range));});
  platChips.querySelectorAll('[data-pl]').forEach(function(b){var k=b.getAttribute('data-pl');b.setAttribute('aria-pressed',String(k==='all'?!state.platforms.length:state.platforms.indexOf(k)>=0));});
  PRODUCTS.forEach(function(p){document.getElementById('pc_'+p.id).checked=state.products.indexOf(p.id)>=0;});
  prodBtn.textContent='Products: '+productScope()+' ▾';
  prodBtn.classList.toggle('primary',state.products.length>0);
  document.getElementById('sourceSel').value=state.source;
  document.getElementById('resetBtn').hidden=!(state.range!==30||state.products.length||state.platforms.length||state.source!=='earned');
  var where=state.view==='abroad'?'Outside Egypt · '+marketLabel():state.view==='radar'?'All countries':'Egypt';
  document.getElementById('period').textContent=where+' · '+fmtD(c.from)+' – '+fmtD(c.to)+' 2026, compared with '+fmtD(c.pfrom)+' – '+fmtD(c.pto)+(state.products.length?' · '+productScope():'');
  var ac=detectAlerts().filter(function(a){return a.sev==='critical';}).length,acEl=document.getElementById('alertCount');
  var rc=CAMPS.filter(function(cp){return campActive(cp.id)&&CINFO[cp.id].level==='High';}).length,rcEl=document.getElementById('radarCount');
  rcEl.hidden=!rc;rcEl.textContent=rc;rcEl.setAttribute('aria-label',rc+' high-risk campaigns');
  acEl.hidden=!ac;acEl.textContent=ac;acEl.setAttribute('aria-label',ac+' alerts to act on');
  VIEWS[state.view](c);
  HOOKS.forEach(function(f){f();});
}
render();
